<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>DevOps Cluster Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a, #020617);
            color: white;
            text-align: center;
        }

        .header {
            padding: 30px;
            font-size: 35px;
            font-weight: bold;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
        }

        .hero h1 {
            font-size: 45px;
            color: #38bdf8;
            margin-top: 40px;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 50px;
        }

        .card {
            background: rgba(255,255,255,0.05);
            padding: 25px;
            border-radius: 15px;
            width: 280px;
            backdrop-filter: blur(15px);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .status {
            color: #22c55e;
            font-weight: bold;
        }

        .footer {
            margin-top: 50px;
            opacity: 0.6;
        }
    </style>
</head>

<body>

<div class="header">🚀 DevOps Cluster Dashboard</div>

<div class="hero">
    <h1>Docker Swarm Running Successfully</h1>
    <p>Node.js + MySQL + Swarm Cluster</p>

    <div class="cards">
        <div class="card">
            <h3>🧠 Backend Node</h3>
            <p>Hostname: <b id="host"></b></p>
            <p>Status: <span class="status">Online</span></p>
        </div>

        <div class="card">
            <h3>🗄️ Database</h3>
            <p id="db">Loading...</p>
            <p>Status: <span class="status">Connected</span></p>
        </div>
    </div>
</div>

<div class="footer">
    ⚡ Powered by Docker Swarm | Built by Jeet 😎
</div>

<script>
fetch("/hostname")
.then(res => res.text())
.then(data => {
    document.getElementById("host").innerText = data;
});

fetch("/data")
.then(res => res.text())
.then(data => {
    document.getElementById("db").innerText = data;
});
</script>

</body>
</html>
